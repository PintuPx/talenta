org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Release identity (PLACEHOLDERS - replace before the first Play upload).
# The application ID can NEVER change after the first upload to Google Play.
# Use a reverse-domain name you own, e.g. com.yourdomain.budget
# ---------------------------------------------------------------------------
APP_ID=com.talenta.finance
APP_NAME=Talenta
APP_VERSION_CODE=3
APP_VERSION_NAME=0.1.2
# Public issue tracker for "Report a bug" (empty = the option is hidden). Set when the GitHub repo exists,
# e.g. https://github.com/<owner>/<repo>/issues
ISSUES_URL=https://github.com/PintuPx/talenta/issues
